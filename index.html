<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">

<style>

:root{

/* ==========================================================
   SCOREBOARD IFRAME
========================================================== */

--score-iframe-width: 500px;
--score-iframe-height: 2500px;

/* ==========================================================
   PLAYERS IFRAME
========================================================== */

--players-iframe-width: 500px;
--players-iframe-height: 2500px;

/* ==========================================================
   TEAM STATS IFRAME
========================================================== */

--team-iframe-width: 500px;
--team-iframe-height: 2500px;

/* ==========================================================
   SCOREBOARD
========================================================== */

/*
BLOKO POZICIJA EKRANE

x = kairė/dešinė
y = aukštyn/žemyn
*/

--score-x: 710px;
--score-y: 10px;

/*
MATOMO LANGO DYDIS
*/

--score-width: 490px;
--score-height: 185px;

/*
FIBA PUSLAPIO CROP

left = horizontalus scroll
top = vertikalus scroll
*/

--score-left: 0px;
--score-top: -200px;

/*
BLOKO DIDINIMAS

1.00 = originalus dydis
*/

--score-scale: 1.00;


/* ==========================================================
   PLAYERS
========================================================== */

--players-x: 0px;
--players-y: 10px;

--players-width: 650px;
--players-height: 800px;

--players-left: 0px;
--players-top: -560px;

--players-scale: 1.35;


/* ==========================================================
   TEAM STATS
========================================================== */

--team-x: 1250px;
--team-y: 10px;

--team-width: 660px;
--team-height: 745px;

--team-left: -0px;
--team-top: -2030px;

--team-scale: 1.35;

}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

}

.panel{

    position:absolute;
    overflow:hidden;

}

/* ==========================================================
   SCOREBOARD
========================================================== */

.score{

    left:var(--score-x);
    top:var(--score-y);

    width:var(--score-width);
    height:var(--score-height);

}

.score iframe{

    position:absolute;

    width:var(--score-iframe-width);
    height:var(--score-iframe-height);

    border:none;

    left:var(--score-left);
    top:var(--score-top);

    transform:scale(var(--score-scale));
    transform-origin:top left;

}

/* ==========================================================
   PLAYERS
========================================================== */

.players{

    left:var(--players-x);
    top:var(--players-y);

    width:var(--players-width);
    height:var(--players-height);

}

.players iframe{

    position:absolute;

    width:var(--players-iframe-width);
    height:var(--players-iframe-height);

    border:none;

    left:var(--players-left);
    top:var(--players-top);

    transform:scale(var(--players-scale));
    transform-origin:top left;

}

/* ==========================================================
   TEAM STATS
========================================================== */

.team{

    left:var(--team-x);
    top:var(--team-y);

    width:var(--team-width);
    height:var(--team-height);

}

.team iframe{

    position:absolute;

    width:var(--team-iframe-width);
    height:var(--team-iframe-height);

    border:none;

    left:var(--team-left);
    top:var(--team-top);

    transform:scale(var(--team-scale));
    transform-origin:top left;

}

</style>

</head>

<body>

<div class="panel score">
    <iframe id="scoreFrame"></iframe>
</div>

<div class="panel players">
    <iframe id="playersFrame"></iframe>
</div>

<div class="panel team">
    <iframe id="teamFrame"></iframe>
</div>

<script>

/* ==========================================================
   KEISTI TIK ŠIĄ REIKŠMĘ
========================================================== */

const GAME_ID = "2792695";

const FIBA_URL =
`https://fibalivestats.dcd.shared.geniussports.com/u/BNW/${GAME_ID}/`;

document.getElementById("scoreFrame").src = FIBA_URL;
document.getElementById("playersFrame").src = FIBA_URL;
document.getElementById("teamFrame").src = FIBA_URL;

</script>

</body>
</html>
